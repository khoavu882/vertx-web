plugins {
    id 'java'
    id 'application'
    id 'jacoco'
    id 'io.freefair.lombok' version '8.6'
    id 'com.diffplug.spotless' version '6.25.0'
    id 'io.smallrye.openapi' version '4.2.4'
}

group = 'com.github.kaivu'
version = '1.0.0-SNAPSHOT'

def vertxVersion = project.property('vertxVersion')
def mutinyVersion = project.property('mutinyVersion')
def guiceVersion = project.property('guiceVersion')
def smallryeConfigVersion = project.property('smallryeConfigVersion')
def lombokVersion = project.property('lombokVersion')
def junitJupiterVersion = project.property('junitJupiterVersion')
def logbackVersion = project.property('logbackVersion')
def slf4jVersion = project.property('slf4jVersion')
def micrometerVersion = project.property('micrometerVersion')
def opentelemetryVersion = project.property('opentelemetryVersion')

repositories {
    mavenCentral()
}

dependencies {
    implementation "io.vertx:vertx-core:${vertxVersion}"
    implementation "io.vertx:vertx-web:${vertxVersion}"
    implementation "io.smallrye.reactive:mutiny:${mutinyVersion}"
    implementation "com.google.inject:guice:${guiceVersion}"
    implementation "io.smallrye.config:smallrye-config:${smallryeConfigVersion}"
    implementation "io.smallrye.config:smallrye-config-source-yaml:${smallryeConfigVersion}"
    implementation "org.slf4j:log4j-over-slf4j:${slf4jVersion}"
    implementation "ch.qos.logback:logback-classic:${logbackVersion}"
    implementation "io.micrometer:micrometer-core:${micrometerVersion}"
    implementation "io.micrometer:micrometer-registry-prometheus:${micrometerVersion}"
    implementation "io.opentelemetry:opentelemetry-api:${opentelemetryVersion}"
    implementation "io.opentelemetry:opentelemetry-sdk:${opentelemetryVersion}"
    implementation "io.opentelemetry:opentelemetry-exporter-logging:${opentelemetryVersion}"
    implementation "io.opentelemetry:opentelemetry-exporter-otlp:${opentelemetryVersion}"
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testImplementation "io.vertx:vertx-junit5:${vertxVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter-api:${junitJupiterVersion}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junitJupiterVersion}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.9.1"
}

test {
    useJUnitPlatform()
    finalizedBy(tasks.named('jacocoTestReport'))
}

jacoco {
    toolVersion = '0.8.12'
}

tasks.named('jacocoTestReport') {
    dependsOn(tasks.named('test'))
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn(tasks.named('jacocoTestReport'))

    violationRules {
        rule {
            element = 'CLASS'
            includes = [
                    'com.github.kaivu.vertxweb.services.UserService',
                    'com.github.kaivu.vertxweb.services.ProductService',
                    'com.github.kaivu.vertxweb.web.validation.Validator'
            ]
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }
}

tasks.named('check') {
    dependsOn(tasks.named('jacocoTestCoverageVerification'))
}

application {
    mainClass = 'com.github.kaivu.vertxweb.StartupApp'
}

smallryeOpenApi {
    infoTitle.set("Vert.x Web API")
    infoVersion.set(project.version.toString())
    infoDescription.set("Reactive Vert.x API documentation")
}

tasks.named('processResources') {
    dependsOn(tasks.named('generateOpenApiSpec'))
    from(layout.buildDirectory.dir('generated/openapi')) {
        include 'openapi.yaml', 'openapi.json'
        into 'openapi'
    }
}

spotless {
    java {
        palantirJavaFormat()
    }
}
