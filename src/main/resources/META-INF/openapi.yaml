openapi: 3.1.0
info:
  title: Vert.x Web API
  version: "1.0.0"
  description: API documentation for the Vert.x Web learning project.
servers:
  - url: http://localhost:8081
    description: Local development server
tags:
  - name: Common
  - name: Users
  - name: Products
  - name: Health
  - name: Observability
paths:
  /api/common:
    get:
      tags: [Common]
      summary: Public endpoint check
      security: []
      responses:
        "200":
          description: Public endpoint status
          content:
            application/json:
              schema:
                type: object
  /api/users:
    get:
      tags: [Users]
      summary: Get all users
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
    post:
      tags: [Users]
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/users/{id}:
    get:
      tags: [Users]
      summary: Get user by id
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Users]
      summary: Update user
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                type: object
    delete:
      tags: [Users]
      summary: Delete user
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User deleted
          content:
            application/json:
              schema:
                type: object
  /api/products:
    get:
      tags: [Products]
      summary: Get all products
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
    post:
      tags: [Products]
      summary: Create product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreateRequest"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                type: object
  /api/products/{productId}:
    get:
      tags: [Products]
      summary: Get product by id
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/products/{productId}/stock:
    put:
      tags: [Products]
      summary: Update product stock
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity:
                  type: integer
                  minimum: 0
      responses:
        "200":
          description: Stock updated
          content:
            application/json:
              schema:
                type: object
  /api/products/analytics/report:
    get:
      tags: [Products]
      summary: Generate analytics report
      responses:
        "200":
          description: Analytics report
          content:
            application/json:
              schema:
                type: object
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/products/batch/{operation}:
    post:
      tags: [Products]
      summary: Trigger batch operation
      parameters:
        - name: operation
          in: path
          required: true
          schema:
            type: string
            enum: [insert, update, delete, migrate]
        - name: confirm
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Batch result
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
  /health:
    get:
      tags: [Health]
      summary: Overall health
      security: []
      responses:
        "200":
          description: Healthy
        "503":
          description: Unhealthy
  /health/live:
    get:
      tags: [Health]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Alive
  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe
      security: []
      responses:
        "200":
          description: Ready
        "503":
          description: Not ready
  /health/started:
    get:
      tags: [Health]
      summary: Startup probe
      security: []
      responses:
        "200":
          description: Started
        "503":
          description: Not started
  /metrics:
    get:
      tags: [Observability]
      summary: Metrics scrape endpoint
      responses:
        "200":
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Service temporarily unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    User:
      type: object
      properties:
        id:
          oneOf:
            - type: integer
            - type: string
        name:
          type: string
        email:
          type: string
        active:
          type: boolean
    UserListResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: integer
    UserCreateRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
        email:
          type: string
    UserUpdateRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        active:
          type: boolean
    Product:
      type: object
      properties:
        id:
          oneOf:
            - type: integer
            - type: string
        productId:
          type: string
        name:
          type: string
        category:
          type: string
        price:
          type: number
        quantity:
          type: integer
        inStock:
          type: boolean
    ProductListResponse:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        total:
          type: integer
    ProductCreateRequest:
      type: object
      required: [name, category, price]
      properties:
        name:
          type: string
        category:
          type: string
        price:
          type: number
        description:
          type: string
        quantity:
          type: integer
          minimum: 0
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        status:
          type: integer
        timestamp:
          oneOf:
            - type: integer
            - type: string
security:
  - bearerAuth: []
